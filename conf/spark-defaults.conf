# Spark configuration for the Codespaces variant of the Hands-on L5 and L6 cluster
# (docker-compose.codespaces.yml). It is mounted at /opt/spark/conf/spark-defaults.conf and
# read by spark-submit and by the PySpark shell, which pass it on to the executors.
#
# On the host network every container has the same address, so Spark sees both executors as
# running on one machine and reads shuffle files straight from the other executor's local
# disk instead of fetching them over the network. The containers have separate filesystems,
# so that read fails:
#
#   FetchFailedException ... Caused by: java.nio.file.NoSuchFileException:
#   /tmp/spark-.../executor-.../blockmgr-.../shuffle_1_2_0.index
#
# Turning the optimization off makes every shuffle block travel over the network, which is
# what happens anyway on a real cluster with one executor per machine.
spark.shuffle.readHostLocalDisk   false
